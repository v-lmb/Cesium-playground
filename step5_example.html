<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Cesium Playground</title>

  <!-- CesiumJS vi CDN (Content Delivery Network > réseau de serveurs qui hébergent les fichiers statiques) : la librairie et ses styles -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.117/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.117/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.0.0/satellite.min.js"></script>

  <style>
	/* le globe doit occupé toute la fenêtre */
	html, body {
	  margin: 0;
	  padding: 0;
	  width: 100%;
	  height: 100%;
	  overflow: hidden;
	}

	#cesiumContainer {
	  width: 100%;
	  height: 100%;
	}
  </style>
</head>
<body>

  <!-- CesiumJs va injecter le rendu 3D dans ce div -->
  <div id="cesiumContainer"></div>

  <script>
	// Mon token Cesium Ion
	Cesium.Ion.defaultAccessToken = 'TOKKEN_ICI';

	// Viewer = le globe complet avec tout les contrôles par défaut
	const viewer = new Cesium.Viewer('cesiumContainer');

	async function loadSatellites() {
	  // 1.Recupérer les TLE depuis Celestrak
	  const response = await fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=tle');
	  const text = await response.text();

	  // 2. Parser le texte : découper en blocs de 3 lignes
	  const lines = text.trim().split('\n');
	  const now = new Date();

	  for (let i = 0; i < lines.length; i +=3) {
		const name = lines[i].trim();
		const tle1 = lines[i + 1].trim();
		const tle2 = lines[ i + 2].trim();

		// 3. Calculer la position de chaque satellite
		const satrec = satellite.twoline2satrec(tle1, tle2);
		const pv = satellite.propagate(satrec, now);

		// ignorer les satellites dont la propagation échoue
		if (!pv.position) continue;

		const gmst = satellite.gstime(now);
		const geo = satellite.eciToGeodetic(pv.position, gmst);

		const longitude = satellite.degreesLong(geo.longitude);
		const latitude = satellite.degreesLat(geo.latitude);
		const altitude = geo.height * 1000;  // en km

		// 4. Ajouter chaque satellites sur le globe
		viewer.entities.add({
		  name: name,
		  position: Cesium.Cartesian3.fromDegrees(longitude, latitude, altitude),
		  point: {
			pixelSize: 8,
			color: Cesium.Color.CYAN,
		  }
		});
	  }

    viewer.zoomTo(viewer.entities);
	}
	loadSatellites();

  </script>
</body>
</html>
